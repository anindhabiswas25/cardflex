<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="-1 -1 32 32">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d9dee8"/><stop offset="1" stop-color="#8e97aa"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b0"/><stop offset=".5" stop-color="#f1c04a"/><stop offset="1" stop-color="#a66c12"/>
