[package]
name = "card-flex"
version = "0.1.0"
description = "Card Flex Teen Patti program (Solana base layer + MagicBlock PER)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "card_flex"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# P1 test deck: predictable, devnet POC only. Never enable for a shared or
# real-value deployment. Without it, poc_deal always fails.
poc-test-deck = []

[dependencies]
anchor-lang = { workspace = true }
card-types = { path = "../../crates/card-types" }
fairness-core = { path = "../../crates/fairness-core" }
# sol_sha256 syscall on-chain; the sha2 feature gives a software fallback for host tests.
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
# Pulled in now so CI proves the pinned Anchor + MagicBlock SDK combination builds.
ephemeral-rollups-sdk = { workspace = true, features = ["anchor", "vrf", "access-control", "crank"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
