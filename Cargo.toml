[workspace]
resolver = "2"
members = ["programs/*", "crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "UNLICENSED"
publish = false

# Exact pins: every version here matches toolchain.env.
[workspace.dependencies]
anchor-lang = "=1.1.2"
ephemeral-rollups-sdk = "=0.17.3"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "s"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[profile.release.package."*"]
opt-level = "z"
